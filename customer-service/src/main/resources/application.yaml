spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:mem:customerdb
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    discovery:
      enabled: true #Activer le service discovery
    config:
      enabled: false

server:
  port: 8000
eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true
#Activation de actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
#Description of customers
  info:
    env:
      enabled: true
info:
  app:
    name: Customers
    description: Customers micro-services application
    version: 1.0.0

