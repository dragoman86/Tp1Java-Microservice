spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:accountdb
  jpa:
    show-sql: true
  h2:
    console:
      enabled: true
  cloud:
    discovery:
      enabled: true
    config:
      enabled: true
  config:
    import: optional:configserver:http://localhost:9999/
  profiles:
    active: "test"

server:
  port: 8100
eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true
#Activation de actuator
management:
  endpoints:
    web:
      exposure:
        include: "*"
  #Description of customers
  info:
    env:
      enabled: true
info:
  app:
    name: Accounts
    description: Accounts micro-services application
    version: 1.0.0
build:
  version: "1.0.2"

accounts:
  message: "Welcome to Iteam Bank- accounts related local API"
  contactDetails:
