spring:
  application:
    name: gateway-service
  cloud:
    discovery:
      enabled: true
    gateway:
      server:
        webflux:
          routes:
            - id: r1
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**
            - id: r2
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/accounts/**
eureka:
  client:
    service-url:
      defaultZone: "http://localhost:8761/eureka/"
  instance:
    prefer-ip-address: true
server:
  port: 8888
